name: Build and publish Trading Portal image

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          REPOSITORY_NAME: ${{ github.repository }}
        run: |
          IMAGE_NAME="ghcr.io/${REPOSITORY_NAME,,}"
          docker build --pull \
            --tag "$IMAGE_NAME:latest" \
            --tag "$IMAGE_NAME:sha-$GITHUB_SHA" .
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"